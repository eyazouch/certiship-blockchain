<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CertiShip — Intro</title>
<style>
  :root {
    --navy: #13235b;
    --navy2: #1d2f6b;
    --blue: #4c7cf3;
    --blue-l: #7aa2ff;
    --yellow: #ffc845;
    --red: #ff4d5a;
    --green: #2ecc71;
    --ink: #1d2547;
    --grey: #8a93b0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070b18; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  body.playing { cursor: none; }

  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; }
  .scene.on { opacity: 1; }
  .scene svg { width: 100%; height: 100%; display: block; }

  text { font-family: "Segoe UI", system-ui, sans-serif; }
  .cap { font-size: 52px; font-weight: 800; text-anchor: middle; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; }
  .hand { font-family: "Comic Sans MS", "Segoe Print", cursive; }

  /* Animations déclenchées quand la scène reçoit la classe .on */
  .pop, .fade, .rise { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .on .pop  { animation: pop .55s cubic-bezier(.34,1.56,.64,1) var(--d,0s) both; }
  .on .fade { animation: fade .6s ease var(--d,0s) both; }
  .on .rise { animation: rise .6s ease-out var(--d,0s) both; }
  @keyframes pop  { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }

  /* Scène 1 : le camion */
  .cloud { animation: drift 40s linear infinite; }
  .cloud.c2 { animation-duration: 55s; animation-delay: -20s; }
  @keyframes drift { from { transform: translateX(-300px); } to { transform: translateX(1900px); } }
  .on .truck { animation: drive 4.6s cubic-bezier(.45,0,.4,1) 1s both; }
  @keyframes drive { from { transform: translateX(0); } to { transform: translateX(800px); } }
  .bob { animation: bob .35s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-3px); } }
  .wheel { transform-box: fill-box; transform-origin: center; }
  .on .wheel { animation: spin .5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .smoke { transform-box: fill-box; transform-origin: center; animation: smoke 3s ease-out infinite; opacity: 0; }
  .smoke.s2 { animation-delay: 1s; } .smoke.s3 { animation-delay: 2s; }
  @keyframes smoke { 0% { opacity: .8; transform: translate(0,0) scale(.6); } 100% { opacity: 0; transform: translate(30px,-140px) scale(1.8); } }

  /* Scène 2 : falsification */
  .strike { stroke-dasharray: 130; stroke-dashoffset: 130; }
  .on .strike { animation: draw .5s ease 2.6s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .on .pencil { animation: pencil 3.4s ease-in-out 1s both; }
  @keyframes pencil {
    0%   { opacity: 0; transform: translate(420px, 320px); }
    12%  { opacity: 1; }
    35%  { transform: translate(0, 0); }
    45%  { transform: translate(-40px, 4px); }
    55%  { transform: translate(-115px, 0); }
    68%  { transform: translate(-60px, -4px); }
    80%  { transform: translate(0, 0); }
    100% { opacity: 0; transform: translate(420px, 320px); }
  }
  .wiggle { animation: wiggle 1.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes wiggle { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

  /* Scène 3 : la blockchain */
  .on .travel { animation: travel 1.1s ease-in-out 3.9s both; }
  @keyframes travel { 0% { opacity: 0; transform: translate(0,0); } 15% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; transform: translate(860px, 50px); } }
  .pulse { transform-box: fill-box; transform-origin: center; }
  .on .pulse { animation: pulse 1.6s ease-in-out 5s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  /* Scène 4 : détection */
  .on .scan { animation: scan 2.1s ease-in-out .4s both; }
  @keyframes scan { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: 1; } 50% { transform: translateX(720px); } 85% { opacity: 1; transform: translateX(360px); } 100% { opacity: 0; transform: translateX(360px); } }
  .stamp { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .on .stamp { animation: stamp .35s cubic-bezier(.2,.9,.3,1.2) 2.6s both; }
  @keyframes stamp { from { opacity: 0; transform: scale(2.4); } to { opacity: 1; transform: scale(1); } }

  /* Écran de lancement */
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(7,11,24,.92);
    color: #fff; text-align: center; z-index: 10; cursor: pointer; }
  #start h1 { font-size: 34px; margin: 0 0 12px; }
  #start p { color: #9fb6ff; margin: 6px 0; font-size: 18px; }
  #start kbd { background: #1d2f6b; border-radius: 6px; padding: 2px 8px; color: #fff; }
  body.playing #start { display: none; }
</style>
</head>
<body>

<div id="start">
  <div>
    <h1>CertiShip — Intro animée (≈ 38 s)</h1>
    <p>1. <kbd>F11</kbd> pour le plein écran &nbsp; 2. lancez l'enregistrement d'écran</p>
    <p>3. <kbd>Espace</kbd> ou clic pour démarrer &nbsp;·&nbsp; <kbd>R</kbd> pour recommencer</p>
  </div>
</div>

<!-- Définitions partagées -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#13235b" flood-opacity=".18"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd4ff"/><stop offset="1" stop-color="#e9f6ff"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1c4a"/><stop offset="1" stop-color="#1f3a8a"/>
    </linearGradient>
    <g id="lock">
      <path d="M -14 -6 V -16 A 14 14 0 0 1 14 -16 V -6" fill="none" stroke="#ffc845" stroke-width="6"/>
      <rect x="-20" y="-8" width="40" height="32" rx="6" fill="#ffc845"/>
      <circle cx="0" cy="6" r="5" fill="#13235b"/>
    </g>
  </defs>
</svg>

<div id="stage">

  <!-- ===== Scène 1 : le trajet ===== -->
  <section class="scene" id="s1">
    <svg viewBox="0 0 1600 900">
      <rect width="1600" height="900" fill="url(#sky)"/>
      <circle cx="1400" cy="150" r="62" fill="#ffd34d"/>
      <g class="cloud"><ellipse cx="200" cy="200" rx="90" ry="34" fill="#fff"/><ellipse cx="250" cy="180" rx="60" ry="40" fill="#fff"/></g>
      <g class="cloud c2"><ellipse cx="300" cy="300" rx="70" ry="26" fill="#fff" opacity=".9"/><ellipse cx="340" cy="285" rx="46" ry="30" fill="#fff" opacity=".9"/></g>

      <rect y="700" width="1600" height="200" fill="#8fd16a"/>
      <rect y="630" width="1600" height="80" fill="#4a4f5c"/>
      <line x1="0" y1="670" x2="1600" y2="670" stroke="#fff" stroke-width="6" stroke-dasharray="40 32"/>

      <!-- Fournisseur -->
      <g transform="translate(70,400)">
        <polygon points="-10,40 120,-50 250,40" fill="#e0703a"/>
        <rect x="10" y="40" width="220" height="190" fill="#ffb86b"/>
        <rect x="95" y="140" width="50" height="90" fill="#9a4f22"/>
        <rect x="30" y="70" width="50" height="45" fill="#cfe6ff"/><rect x="160" y="70" width="50" height="45" fill="#cfe6ff"/>
        <rect x="20" y="-110" width="200" height="46" rx="10" fill="#13235b"/>
        <text x="120" y="-79" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">FOURNISSEUR</text>
      </g>

      <!-- Usine -->
      <g transform="translate(1270,420)">
        <rect x="190" y="-90" width="40" height="110" fill="#6b7695"/>
        <circle class="smoke" cx="210" cy="-100" r="20" fill="#d6dbe8"/>
        <circle class="smoke s2" cx="210" cy="-100" r="20" fill="#d6dbe8"/>
        <circle class="smoke s3" cx="210" cy="-100" r="20" fill="#d6dbe8"/>
        <polygon points="0,20 60,-20 60,20 120,-20 120,20 180,-20 180,20" fill="#7d89aa"/>
        <rect x="0" y="20" width="270" height="190" fill="#9aa7c7"/>
        <rect x="105" y="110" width="70" height="100" fill="#5b6687"/>
        <rect x="25" y="55" width="55" height="40" fill="#cfe6ff"/><rect x="195" y="55" width="55" height="40" fill="#cfe6ff"/>
        <rect x="45" y="-150" width="180" height="46" rx="10" fill="#13235b"/>
        <text x="135" y="-119" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">USINE</text>
      </g>

      <!-- Camion -->
      <g transform="translate(320,540)">
        <g class="truck"><g class="bob">
          <rect x="0" y="0" width="180" height="100" rx="10" fill="#fff" stroke="#2f5bd3" stroke-width="5"/>
          <rect x="62" y="28" width="56" height="46" rx="4" fill="#d9a066"/><rect x="85" y="28" width="10" height="46" fill="#c48a4f"/>
          <rect x="180" y="34" width="78" height="66" rx="10" fill="#2f5bd3"/>
          <rect x="196" y="44" width="40" height="24" rx="4" fill="#cfe6ff"/>
          <g class="wheel"><circle cx="45" cy="104" r="22" fill="#222"/><circle cx="45" cy="104" r="8" fill="#bbb"/><line x1="45" y1="86" x2="45" y2="96" stroke="#bbb" stroke-width="4"/></g>
          <g class="wheel"><circle cx="210" cy="104" r="22" fill="#222"/><circle cx="210" cy="104" r="8" fill="#bbb"/><line x1="210" y1="86" x2="210" y2="96" stroke="#bbb" stroke-width="4"/></g>
        </g></g>
      </g>

      <!-- Étiquettes de dates -->
      <g transform="translate(330,330)"><g class="pop" style="--d:1.3s">
        <rect x="0" y="-36" width="240" height="56" rx="28" fill="#fff" filter="url(#sh)"/>
        <text x="120" y="2" font-size="28" font-weight="700" fill="#1d2547" text-anchor="middle">Expédié le 11/11</text>
      </g></g>
      <g transform="translate(1280,330)"><g class="pop" style="--d:5.7s">
        <rect x="0" y="-36" width="240" height="56" rx="28" fill="#fff" filter="url(#sh)"/>
        <text x="120" y="2" font-size="28" font-weight="700" fill="#1d2547" text-anchor="middle">Arrivé le 13/11</text>
      </g></g>

      <text class="cap fade" x="800" y="110" fill="#13235b" style="--d:.2s">Un produit quitte le fournisseur… et arrive à l'usine.</text>
    </svg>
  </section>

  <!-- ===== Scène 2 : le problème ===== -->
  <section class="scene" id="s2">
    <svg viewBox="0 0 1600 900">
      <rect width="1600" height="900" fill="#fff6ec"/>
      <text class="cap fade" x="800" y="110" fill="#13235b">Mais ces dates sont stockées dans une base de données…</text>

      <g class="rise" style="--d:.3s">
        <rect x="360" y="190" width="880" height="460" rx="28" fill="#fff" filter="url(#sh)"/>
        <path d="M 360 270 V 218 A 28 28 0 0 1 388 190 H 1212 A 28 28 0 0 1 1240 218 V 270 Z" fill="#13235b"/>
        <text x="800" y="242" fill="#fff" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="3">BASE DE DONNÉES</text>
        <g font-size="24" fill="#8a93b0" font-weight="700">
          <text x="410" y="320">N°</text><text x="520" y="320">PRODUIT</text><text x="820" y="320">EXPÉDIÉ</text><text x="1030" y="320">ARRIVÉ</text>
        </g>
        <line x1="400" y1="340" x2="1200" y2="340" stroke="#e6e9f2" stroke-width="2"/>
        <g font-size="36" fill="#1d2547">
          <text x="410" y="395">#7</text><text x="520" y="395">Javel</text><text x="820" y="395">11/11</text><text x="1030" y="395">13/11</text>
          <text x="410" y="475">#5</text><text x="520" y="475">Crème</text><text x="820" y="475">11/11</text><text x="1030" y="475">14/11</text>
          <text x="410" y="555">#9</text><text x="520" y="555">Bouilloire</text><text x="820" y="555">11/11</text><text x="1030" y="555">13/11</text>
        </g>
      </g>

      <line class="strike" x1="1020" y1="383" x2="1140" y2="383" stroke="#ff4d5a" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(1150,400) rotate(-8)"><text class="hand fade" x="0" y="0" font-size="46" font-weight="700" fill="#ff4d5a" style="--d:3.1s">15/11</text></g>

      <!-- Crayon -->
      <g transform="translate(1150,385)"><g class="pencil"><g transform="rotate(-35)">
        <polygon points="0,0 30,-12 30,12" fill="#f3c98b"/><polygon points="0,0 10,-4 10,4" fill="#333"/>
        <rect x="30" y="-12" width="180" height="24" fill="#ffc845"/>
        <rect x="200" y="-12" width="18" height="24" fill="#c0c6d4"/>
        <rect x="218" y="-12" width="28" height="24" rx="5" fill="#ff8fa3"/>
      </g></g></g>

      <!-- Personnage masqué -->
      <g transform="translate(1460,790) scale(.85)"><g class="pop" style="--d:.7s"><g class="wiggle">
        <path d="M -120 130 Q -110 40 0 40 Q 110 40 120 130 Z" fill="#3b3f58"/>
        <circle cx="0" cy="-20" r="98" fill="#3b3f58"/>
        <circle cx="0" cy="-10" r="72" fill="#ffd1a6"/>
        <rect x="-78" y="-48" width="156" height="38" rx="18" fill="#222"/>
        <circle cx="-30" cy="-29" r="11" fill="#fff"/><circle cx="30" cy="-29" r="11" fill="#fff"/>
        <circle cx="-35" cy="-29" r="5" fill="#222"/><circle cx="25" cy="-29" r="5" fill="#222"/>
        <path d="M -28 22 Q 0 40 34 14" stroke="#7a3e1d" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g></g></g>

      <text class="cap pop" x="650" y="760" fill="#ff4d5a" style="--d:4.2s;font-size:44px">…qui peuvent être modifiées sans laisser de trace.</text>
    </svg>
  </section>

  <!-- ===== Scène 2b : la question ===== -->
  <section class="scene" id="s2b">
    <svg viewBox="0 0 1600 900">
      <rect width="1600" height="900" fill="url(#night)"/>
      <g class="pop" style="--d:.1s"><circle cx="800" cy="450" r="250" fill="#ffc845" fill-opacity=".14"/></g>
      <text class="pop" x="800" y="490" font-size="120" font-weight="900" fill="#fff" text-anchor="middle" style="--d:.2s">Qui prouve les dates ?</text>
    </svg>
  </section>

  <!-- ===== Scène 3 : la solution ===== -->
  <section class="scene" id="s3">
    <svg viewBox="0 0 1600 900">
      <rect width="1600" height="900" fill="url(#night)"/>
      <text class="cap fade" x="800" y="110" fill="#fff" style="font-size:44px">CertiShip ancre chaque événement dans la blockchain Ethereum</text>

      <!-- Colis -->
      <g transform="translate(130,380)"><g class="pop" style="--d:.5s">
        <rect x="0" y="0" width="200" height="170" rx="10" fill="#d9a066"/>
        <polygon points="0,0 100,40 200,0" fill="#e8b57c"/>
        <rect x="85" y="0" width="30" height="170" fill="#c48a4f"/>
        <rect x="30" y="98" width="140" height="48" rx="8" fill="#fff"/>
        <text x="100" y="131" font-size="26" font-weight="800" fill="#13235b" text-anchor="middle">n°7</text>
      </g></g>
      <text class="fade" x="230" y="600" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" style="--d:.8s">Expédition</text>

      <g class="fade" style="--d:1s"><line x1="350" y1="465" x2="420" y2="465" stroke="#7aa2ff" stroke-width="8"/><polygon points="420,450 445,465 420,480" fill="#7aa2ff"/></g>

      <!-- Empreinte -->
      <g transform="translate(540,465)"><g class="pop" style="--d:1.4s">
        <circle r="85" fill="#4c7cf3"/>
        <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
          <path d="M -42 22 A 46 46 0 0 1 42 22"/><path d="M -30 34 A 34 34 0 0 1 30 34"/>
          <path d="M -54 0 A 58 58 0 0 1 54 0"/><path d="M -16 44 A 18 18 0 0 1 16 44"/>
          <path d="M -40 -26 A 60 60 0 0 1 40 -26"/>
        </g>
      </g></g>
      <text class="fade" x="540" y="600" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" style="--d:1.8s">Empreinte SHA-256</text>
      <text class="mono fade" x="540" y="640" font-size="26" fill="#ffc845" text-anchor="middle" style="--d:2s">0x9b06…6d7f</text>

      <g class="fade" style="--d:2.2s"><line x1="640" y1="465" x2="690" y2="465" stroke="#7aa2ff" stroke-width="8"/><polygon points="690,450 715,465 690,480" fill="#7aa2ff"/></g>

      <!-- Blocs -->
      <g class="pop" style="--d:2.4s">
        <rect x="730" y="360" width="220" height="210" rx="22" fill="#1f3a8a" stroke="#7aa2ff" stroke-width="4"/>
        <text x="840" y="410" font-size="22" fill="#9fb6ff" text-anchor="middle" font-weight="700" letter-spacing="3">BLOC</text>
        <text x="840" y="452" font-size="28" fill="#fff" text-anchor="middle" class="mono">#12135217</text>
        <use href="#lock" transform="translate(840,515)"/>
      </g>
      <g class="fade" style="--d:2.9s" fill="none" stroke="#ffc845" stroke-width="8">
        <ellipse cx="968" cy="465" rx="24" ry="13"/><ellipse cx="996" cy="465" rx="24" ry="13"/>
      </g>
      <g class="pop" style="--d:2.8s">
        <rect x="1010" y="360" width="220" height="210" rx="22" fill="#1f3a8a" stroke="#7aa2ff" stroke-width="4"/>
        <text x="1120" y="410" font-size="22" fill="#9fb6ff" text-anchor="middle" font-weight="700" letter-spacing="3">BLOC</text>
        <text x="1120" y="452" font-size="28" fill="#fff" text-anchor="middle" class="mono">#12135218</text>
        <use href="#lock" transform="translate(1120,515)"/>
      </g>
      <g class="fade" style="--d:3.3s" fill="none" stroke="#ffc845" stroke-width="8">
        <ellipse cx="1248" cy="465" rx="24" ry="13"/><ellipse cx="1276" cy="465" rx="24" ry="13"/>
      </g>
      <g class="pop" style="--d:3.2s"><g class="pulse">
        <rect x="1290" y="360" width="220" height="210" rx="22" fill="#1f3a8a" stroke="#ffc845" stroke-width="5"/>
        <text x="1400" y="410" font-size="22" fill="#9fb6ff" text-anchor="middle" font-weight="700" letter-spacing="3">BLOC</text>
        <text x="1400" y="452" font-size="28" fill="#fff" text-anchor="middle" class="mono">#12135219</text>
        <use href="#lock" transform="translate(1400,515)"/>
      </g></g>
      <g class="pop" style="--d:4.9s">
        <rect x="1300" y="585" width="200" height="56" rx="12" fill="#ffc845"/>
        <text x="1400" y="622" font-size="26" font-weight="800" fill="#13235b" text-anchor="middle">n°7 · 21:06:24</text>
      </g>

      <g transform="translate(540,465)"><circle class="travel" r="14" fill="#ffc845"/></g>

      <!-- Garanties -->
      <g font-size="30" fill="#fff" text-anchor="middle" font-weight="700">
        <g class="rise" style="--d:5.4s"><rect x="150" y="700" width="360" height="70" rx="35" fill="#ffffff" fill-opacity=".1" stroke="#7aa2ff" stroke-width="3"/><text x="330" y="746">✓ Horodaté par le réseau</text></g>
        <g class="rise" style="--d:5.8s"><rect x="620" y="700" width="360" height="70" rx="35" fill="#ffffff" fill-opacity=".1" stroke="#7aa2ff" stroke-width="3"/><text x="800" y="746">✓ Signé par son auteur</text></g>
        <g class="rise" style="--d:6.2s"><rect x="1090" y="700" width="360" height="70" rx="35" fill="#ffffff" fill-opacity=".1" stroke="#7aa2ff" stroke-width="3"/><text x="1270" y="746">✓ Vérifiable par tous</text></g>
      </g>
    </svg>
  </section>

  <!-- ===== Scène 4 : la falsification détectée ===== -->
  <section class="scene" id="s4">
    <svg viewBox="0 0 1600 900">
      <rect width="1600" height="900" fill="#eef3ff"/>
      <text class="cap fade" x="800" y="130" fill="#13235b">Une date modifiée ? La blockchain la contredit.</text>

      <g class="rise" style="--d:.2s">
        <rect x="200" y="250" width="480" height="330" rx="24" fill="#fff" filter="url(#sh)"/>
        <text x="440" y="310" font-size="26" fill="#8a93b0" font-weight="700" text-anchor="middle" letter-spacing="2">BASE DE DONNÉES</text>
        <text x="440" y="380" font-size="38" fill="#1d2547" font-weight="800" text-anchor="middle">Produit n°7</text>
        <text x="440" y="440" font-size="30" fill="#8a93b0" text-anchor="middle">Arrivé le</text>
        <text x="440" y="525" font-size="72" fill="#ff4d5a" font-weight="900" text-anchor="middle" class="hand">15/11</text>
      </g>
      <g class="rise" style="--d:.4s">
        <rect x="920" y="250" width="480" height="330" rx="24" fill="#13235b" filter="url(#sh)"/>
        <text x="1160" y="310" font-size="26" fill="#9fb6ff" font-weight="700" text-anchor="middle" letter-spacing="2">BLOCKCHAIN</text>
        <use href="#lock" transform="translate(1355,300)"/>
        <text x="1160" y="380" font-size="38" fill="#fff" font-weight="800" text-anchor="middle">Produit n°7</text>
        <text x="1160" y="440" font-size="30" fill="#9fb6ff" text-anchor="middle">Arrivé le</text>

<script>
  const SCENES = [['s1', 7600], ['s2', 7600], ['s2b', 2600], ['s3', 9000], ['s4', 6000], ['s5', 6000]];
  let timers = [];

  function show(id) {
    document.querySelectorAll('.scene').forEach((s) => s.classList.remove('on'));
    const el = document.getElementById(id);
    void el.getBoundingClientRect(); // relance les animations CSS
    el.classList.add('on');
  }

  function play() {
    timers.forEach(clearTimeout);
    timers = [];
    document.body.classList.add('playing');
    let t = 0;
    for (const [id, duration] of SCENES) {
      timers.push(setTimeout(() => show(id), t));
      t += duration;
    }
  }

  document.getElementById('start').addEventListener('click', play);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === 'r' || e.key === 'R') { e.preventDefault(); play(); }
  });
  window.show = show; // aperçu d'une scène : show('s3')
</script>
