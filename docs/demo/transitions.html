<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CertiShip — Transitions</title>
<style>
  :root {
    --navy: #13235b;
    --blue: #4c7cf3;
    --blue-l: #7aa2ff;
    --yellow: #ffc845;
    --red: #ff4d5a;
    --green: #2ecc71;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070b18; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  body.playing { cursor: none; }

  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); overflow: hidden; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #card { opacity: 0; transition: opacity .5s ease; }
  #card.on { opacity: 1; }

  text { font-family: "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; }

  /* Animations déclenchées quand la carte reçoit la classe .on */
  .pop, .fade, .rise, .slide { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .on .pop   { animation: pop .6s cubic-bezier(.34,1.56,.64,1) var(--d,0s) both; }
  .on .fade  { animation: fade .6s ease var(--d,0s) both; }
  .on .rise  { animation: rise .6s ease-out var(--d,0s) both; }
  .on .slide { animation: slide .6s ease-out var(--d,0s) both; }
  @keyframes pop   { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise  { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }

  .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
  .on .bar { animation: grow .7s ease-out var(--d,0s) forwards; }
  @keyframes grow { to { transform: scaleX(1); } }

  /* Fond : chaîne de blocs qui défile lentement */
  .drift { animation: drift 30s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-300px); } }
  .glow { transform-box: fill-box; transform-origin: center; }
  .on .glow { animation: glow 3s ease-in-out 1s infinite; }
  @keyframes glow { 50% { transform: scale(1.06); opacity: .8; } }
  .blink { transform-box: fill-box; transform-origin: center; }
  .on .blink { animation: blink 1.6s ease-in-out 2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .spin { transform-box: fill-box; transform-origin: center; }
  .on .spin { animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wheel { transform-box: fill-box; transform-origin: center; }
  .on .wheel { animation: spin .6s linear infinite; }

  /* Menu */
  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(7,11,24,.94);
    color: #fff; z-index: 10; }
  #menu h1 { font-size: 32px; margin: 0 0 8px; text-align: center; }
  #menu p { color: #9fb6ff; margin: 4px 0 18px; font-size: 17px; text-align: center; }
  #menu ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  #menu li button { width: 100%; text-align: left; font: inherit; font-size: 18px; color: #fff; cursor: pointer;
    background: #13235b; border: 1px solid #2c4296; border-radius: 10px; padding: 10px 16px; }
  #menu li button:hover { background: #1d2f6b; }
  #menu kbd { background: #ffc845; color: #13235b; border-radius: 6px; padding: 1px 8px; font-weight: 800; margin-right: 10px; }
  #menu .muted { color: #9fb6ff; font-size: 15px; margin-left: 6px; }
  body.playing #menu { display: none; }
</style>
</head>
<body>

<div id="menu">
  <div>
    <h1>CertiShip — Pages de transition</h1>
    <p><kbd>F11</kbd> plein écran · lancez l'enregistrement · appuyez sur le numéro de la carte<br>
       <kbd>→</kbd> carte suivante · <kbd>R</kbd> rejouer · <kbd>Échap</kbd> revenir à ce menu</p>
    <ol id="list"></ol>
  </div>
</div>

<div id="stage">
  <svg viewBox="0 0 1600 900" id="card"></svg>
</div>

<script>
  // Icônes dessinées autour de (0,0), dans un cercle de rayon ~200
  const LOCK = (s = 1, color = '#ffc845') => `
    <g transform="scale(${s})">
      <path d="M -14 -6 V -16 A 14 14 0 0 1 14 -16 V -6" fill="none" stroke="${color}" stroke-width="6"/>
      <rect x="-20" y="-8" width="40" height="32" rx="6" fill="${color}"/>
      <circle cx="0" cy="6" r="5" fill="#13235b"/>
    </g>`;

  const ICONS = {
    truck: `
      <g transform="translate(-130,-60)">
        <rect x="0" y="0" width="170" height="100" rx="10" fill="#fff" stroke="#2f5bd3" stroke-width="5"/>
        <rect x="56" y="26" width="58" height="48" rx="4" fill="#d9a066"/><rect x="80" y="26" width="10" height="48" fill="#c48a4f"/>
        <rect x="170" y="34" width="80" height="66" rx="10" fill="#2f5bd3"/>
        <rect x="186" y="44" width="42" height="24" rx="4" fill="#cfe6ff"/>
        <g class="wheel"><circle cx="45" cy="104" r="22" fill="#222"/><circle cx="45" cy="104" r="8" fill="#bbb"/><line x1="45" y1="86" x2="45" y2="96" stroke="#bbb" stroke-width="4"/></g>
        <g class="wheel"><circle cx="205" cy="104" r="22" fill="#222"/><circle cx="205" cy="104" r="8" fill="#bbb"/><line x1="205" y1="86" x2="205" y2="96" stroke="#bbb" stroke-width="4"/></g>
      </g>
      <g transform="translate(90,-120)"><g class="pop" style="--d:1.2s">
        <rect x="-62" y="-30" width="124" height="60" rx="14" fill="#ffc845"/>
        <text x="0" y="12" font-size="30" font-weight="900" fill="#13235b" text-anchor="middle">n°10</text>
      </g></g>`,

    factory: `
      <g transform="translate(-140,-40)">
        <rect x="190" y="-90" width="36" height="100" fill="#6b7695"/>
        <polygon points="0,20 60,-20 60,20 120,-20 120,20 180,-20 180,20" fill="#7d89aa"/>
        <rect x="0" y="20" width="250" height="160" fill="#9aa7c7"/>
        <rect x="95" y="95" width="64" height="85" fill="#5b6687"/>
        <rect x="22" y="50" width="50" height="36" fill="#cfe6ff"/><rect x="180" y="50" width="50" height="36" fill="#cfe6ff"/>
      </g>
      <g transform="translate(115,95)"><g class="pop" style="--d:1.2s">
        <circle r="56" fill="#2ecc71" stroke="#fff" stroke-width="8"/>
        <path d="M -24 2 L -6 20 L 26 -16" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </g></g>`,

    verify: `
      <g transform="translate(-30,-10)">
        <circle r="110" fill="#4c7cf3"/>
        <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
          <path d="M -58 30 A 64 64 0 0 1 58 30"/><path d="M -42 47 A 47 47 0 0 1 42 47"/>
          <path d="M -74 0 A 80 80 0 0 1 74 0"/><path d="M -22 62 A 25 25 0 0 1 22 62"/>
          <path d="M -55 -36 A 84 84 0 0 1 55 -36"/>
        </g>
      </g>
      <g transform="translate(70,70)"><g class="pop" style="--d:1s">
        <circle r="62" fill="#ffffff" fill-opacity=".25" stroke="#fff" stroke-width="14"/>
        <line x1="44" y1="44" x2="100" y2="100" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
      </g></g>
      <g transform="translate(-120,-120)"><g class="pop" style="--d:1.5s">
        <circle r="38" fill="#2ecc71" stroke="#fff" stroke-width="6"/>
        <path d="M -16 1 L -4 13 L 17 -11" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </g></g>
      <g transform="translate(110,-120)"><g class="pop" style="--d:1.8s">
        <circle r="38" fill="#ff4d5a" stroke="#fff" stroke-width="6"/>
        <path d="M -13 -13 L 13 13 M 13 -13 L -13 13" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      </g></g>`,

    admin: `
      <path d="M 0 -160 L 130 -110 V 0 Q 130 115 0 165 Q -130 115 -130 0 V -110 Z" fill="#1f3a8a" stroke="#7aa2ff" stroke-width="8"/>
      <g transform="translate(0,-5)">${LOCK(3.2)}</g>
      <g transform="translate(120,120)"><g class="pop" style="--d:1.3s">
        <circle r="50" fill="#ff4d5a" stroke="#fff" stroke-width="7"/>
        <line x1="-24" y1="0" x2="24" y2="0" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
      </g></g>`,

    globe: `
      <g class="spin">
        <circle r="150" fill="#1f3a8a" stroke="#7aa2ff" stroke-width="6"/>
        <g fill="none" stroke="#7aa2ff" stroke-width="3" opacity=".7">
          <ellipse rx="150" ry="55"/><ellipse rx="55" ry="150"/><ellipse rx="110" ry="150"/>
          <line x1="-150" y1="0" x2="150" y2="0"/>
        </g>
      </g>
      <g stroke="#ffc845" stroke-width="4" opacity=".9">
        <line x1="-95" y1="-70" x2="40" y2="-110"/><line x1="40" y1="-110" x2="110" y2="20"/>
        <line x1="110" y1="20" x2="-20" y2="95"/><line x1="-20" y1="95" x2="-95" y2="-70"/><line x1="-95" y1="-70" x2="110" y2="20"/>
      </g>
      <g fill="#ffc845">
        <circle class="blink" cx="-95" cy="-70" r="14"/><circle class="blink" cx="40" cy="-110" r="14" style="animation-delay:2.4s"/>
        <circle class="blink" cx="110" cy="20" r="14" style="animation-delay:2.8s"/><circle class="blink" cx="-20" cy="95" r="14" style="animation-delay:3.2s"/>
      </g>`,

    tests: `
      <g transform="translate(-170,-130)">
        <rect width="340" height="260" rx="18" fill="#0b1230" stroke="#7aa2ff" stroke-width="5"/>
        <rect width="340" height="44" rx="18" fill="#1d2f6b"/><rect y="26" width="340" height="18" fill="#1d2f6b"/>
        <circle cx="28" cy="22" r="8" fill="#ff4d5a"/><circle cx="54" cy="22" r="8" fill="#ffc845"/><circle cx="80" cy="22" r="8" fill="#2ecc71"/>
        <g class="mono" font-size="26" font-weight="700">
          <text class="slide" style="--d:1s" x="26" y="100" fill="#2ecc71">✓ forge  27 passed</text>
          <text class="slide" style="--d:1.3s" x="26" y="150" fill="#2ecc71">✓ npm    22 pass</text>
          <text class="slide" style="--d:1.6s" x="26" y="200" fill="#ffc845">  coverage 100 %</text>
        </g>
      </g>`,

    logo: `
      <g fill="none" stroke="#7aa2ff" stroke-width="22">
        <rect x="-110" y="-70" width="140" height="80" rx="40" transform="rotate(-30 -40 -30)"/>
        <rect x="-20" y="-20" width="140" height="80" rx="40" stroke="#ffc845" transform="rotate(-30 50 20)"/>
      </g>`,
  };

  const CARDS = [
    { label: 'ÉTAPE 1', icon: 'truck', title: ['Le fournisseur', 'déclare une expédition'],
      sub: 'Signée avec MetaMask, horodatée par la blockchain',
      points: ['Numéro attribué par le Smart Contract', 'Empreinte SHA-256 des données', 'Chaînée au produit précédent'] },
    { label: 'ÉTAPE 2', icon: 'factory', title: ["L'opérateur", 'confirme la réception'],
      sub: 'Une seule confirmation possible par produit',
      points: ['Rôle vérifié par le contrat', 'Date certifiée par le bloc', 'Délai calculé et prouvé'] },
    { label: 'ÉTAPE 3', icon: 'verify', title: ['Vérification', 'et falsification'],
      sub: 'La base peut être modifiée, la blockchain non',
      points: ['Empreintes recalculées', '8 contrôles automatiques', 'Falsification localisée'] },
    { label: 'ÉTAPE 4', icon: 'admin', title: ['Gestion', 'des autorisations'],
      sub: 'Les rôles sont inscrits dans le Smart Contract',
      points: ["L'administrateur autorise ou révoque", 'Révocation immédiate on-chain', 'Toute transaction refusée ensuite'] },
    { label: 'ÉTAPE 5', icon: 'globe', title: ['Sur le réseau public', 'Ethereum Sepolia'],
      sub: 'Vérifiable par tous sur Etherscan',
      points: ['Un vrai réseau décentralisé', 'Un bloc toutes les 12 secondes', 'Aucune confiance requise'] },
    { label: 'QUALITÉ', icon: 'tests', title: ['49 tests', 'automatiques'],
      sub: '100 % de couverture du Smart Contract',
      points: ['Tests unitaires', 'Fuzzing : 1 000 valeurs par règle', 'Invariants : 5 120 opérations'] },
    { label: 'FIN', icon: 'logo', final: true },
  ];

  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  function background() {
    // Chaîne de blocs discrète en bas de l'écran, qui défile
    let blocks = '';
    for (let i = 0; i < 9; i++) {
      const x = i * 300;
      blocks += `<rect x="${x}" y="860" width="200" height="120" rx="20" fill="#1f3a8a" fill-opacity=".35" stroke="#7aa2ff" stroke-opacity=".25" stroke-width="3"/>
        <g fill="none" stroke="#ffc845" stroke-opacity=".25" stroke-width="6"><ellipse cx="${x + 235}" cy="920" rx="22" ry="12"/><ellipse cx="${x + 265}" cy="920" rx="22" ry="12"/></g>`;
    }
    return `
      <defs>
        <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0f1c4a"/><stop offset="1" stop-color="#1f3a8a"/>
        </linearGradient>
        <radialGradient id="halo"><stop offset="0" stop-color="#4c7cf3" stop-opacity=".45"/><stop offset="1" stop-color="#4c7cf3" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#night)"/>
      <g class="drift">${blocks}</g>`;
  }

  function progress(index) {
    const steps = CARDS.filter((c) => !c.final).length;
    let out = '';
    const w = 90, gap = 18, total = steps * w + (steps - 1) * gap, x0 = 800 - total / 2;
    for (let i = 0; i < steps; i++) {
      const x = x0 + i * (w + gap);
      const done = i < index;
      out += `<rect x="${x}" y="808" width="${w}" height="10" rx="5" fill="${done ? '#7aa2ff' : '#ffffff'}" fill-opacity="${done ? 1 : .18}"/>`;
      if (i === index) out += `<rect class="bar" style="--d:.9s" x="${x}" y="808" width="${w}" height="10" rx="5" fill="#ffc845"/>`;
    }
    return `<g class="fade" style="--d:.3s">${out}</g>`;
  }

  function render(index) {
    const c = CARDS[index];
    if (c.final) {
      return background() + `
        <g class="pop" style="--d:.1s"><circle cx="800" cy="300" r="190" fill="url(#halo)"/></g>
        <g transform="translate(800,300)"><g class="pop" style="--d:.2s">${ICONS.logo}</g></g>
        <text class="pop" x="800" y="560" font-size="150" font-weight="900" fill="#fff" text-anchor="middle" style="--d:.5s">Merci !</text>
        <text class="rise" x="800" y="650" font-size="44" font-weight="700" fill="#ffc845" text-anchor="middle" style="--d:1.1s">CertiShip — des dates que personne ne peut falsifier.</text>
        <text class="fade" x="800" y="730" font-size="28" fill="#9fb6ff" text-anchor="middle" letter-spacing="2" style="--d:1.8s">Solidity · Ethereum · Node.js · React · MetaMask</text>`;
    }
    const points = c.points.map((p, i) => `
      <g class="slide" style="--d:${1.7 + i * .25}s">
        <circle cx="722" cy="${662 + i * 50}" r="13" fill="#2ecc71"/>
        <path d="M 715 ${662 + i * 50} l 5 5 l 9 -10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="750" y="${672 + i * 50}" font-size="30" fill="#e6ecff">${esc(p)}</text>
      </g>`).join('');
    return background() + `
      <g class="pop" style="--d:.1s"><circle class="glow" cx="370" cy="430" r="250" fill="url(#halo)"/></g>
      <g class="pop" style="--d:.15s"><circle cx="370" cy="430" r="215" fill="#ffffff" fill-opacity=".05" stroke="#7aa2ff" stroke-opacity=".5" stroke-width="4"/></g>
      <g transform="translate(370,430)"><g class="pop" style="--d:.35s">${ICONS[c.icon]}</g></g>

      <text class="fade" x="700" y="250" font-size="30" font-weight="800" fill="#7aa2ff" letter-spacing="7" style="--d:.5s">${esc(c.label)}</text>
      <text class="rise" x="696" y="345" font-size="68" font-weight="900" fill="#fff" style="--d:.7s">${esc(c.title[0])}</text>
      <text class="rise" x="696" y="428" font-size="68" font-weight="900" fill="#fff" style="--d:.85s">${esc(c.title[1])}</text>
      <rect class="bar" x="700" y="458" width="170" height="10" rx="5" fill="#ffc845" style="--d:1.1s"/>
      <text class="fade" x="700" y="540" font-size="34" font-weight="700" fill="#ffc845" style="--d:1.3s">${esc(c.sub)}</text>
      ${points}
      ${progress(index)}`;
  }

  const svg = document.getElementById('card');
  let current = 0;

  function play(index) {
    current = Math.max(0, Math.min(CARDS.length - 1, index));
    document.body.classList.add('playing');
    svg.classList.remove('on');
    svg.innerHTML = render(current);
    void svg.getBoundingClientRect(); // relance les animations CSS
    requestAnimationFrame(() => svg.classList.add('on'));
  }

  // Menu
  const list = document.getElementById('list');
  CARDS.forEach((c, i) => {
    const li = document.createElement('li');
    const name = c.final ? 'Merci !' : `${c.label} — ${c.title.join(' ')}`;
    li.innerHTML = `<button><kbd>${i + 1}</kbd>${esc(name)}</button>`;
    li.querySelector('button').addEventListener('click', () => play(i));
    list.appendChild(li);
  });

  document.addEventListener('keydown', (e) => {
    const n = Number.parseInt(e.key, 10);
    if (n >= 1 && n <= CARDS.length) play(n - 1);
    else if (e.key === 'ArrowRight' || e.code === 'Space') { e.preventDefault(); play(current + 1); }
    else if (e.key === 'ArrowLeft') play(current - 1);
    else if (e.key === 'r' || e.key === 'R') play(current);
    else if (e.key === 'Escape') { document.body.classList.remove('playing'); svg.classList.remove('on'); }
  });
  window.play = play; // aperçu : play(0)
</script>
</body>
</html>
